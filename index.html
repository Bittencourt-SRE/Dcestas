<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D'cestas e Presentes - Cidreira</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; background: #fdf8f5; color: #333; }
.header { position: relative; }
.header img { width: 100%; height: auto; display: block; }

.menu-btn { position: absolute; top: 25px; left: 25px; background: none; border: none; cursor: pointer; z-index: 100; }
.menu-btn div { width: 30px; height: 4px; background: #000; margin: 6px 0; border-radius: 2px; }

.botoes-topo { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.btn-icone { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
.btn-icone-whatsapp { background: #25D366; }
.btn-icone-instagram { background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); }

.sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #6b3e26; transition: 0.3s; padding-top: 100px; z-index: 99; }
.sidebar.active { left: 0; }
.sidebar a { display: block; padding: 18px 30px; color: #fff; text-decoration: none; font-size: 18px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; background: none; border: none; color: #fff; cursor: pointer; }

.page { display: none; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
.page.active { display: block; }
.page h2 { color: #6b3e26; text-align: center; font-size: 28px; margin-bottom: 30px; }
.voltar-btn { background: #6b3e26; color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: 600; }

.produtos { background: #f5e9da; border-radius: 15px; padding: 30px 20px; }
.catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

/* CARD QUE VIRA - VERSÃO FINAL */
.card-wrapper { perspective: 1000px; position: relative; }
.card {
  position: relative; width: 100%; height: 430px; /* Altura fixa pra animação */
  transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
  border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  overflow: hidden; background: #fff; display: flex; flex-direction: column; text-align: center;
}
.card-back {
  transform: rotateY(180deg);
  background: #6b3e26;
  color: #fff;
  padding: 20px;
}

.card.premium.card-front { border: 3px solid #d4af37; }
.card-wrapper:has(.premium)::after {
  content: "PREMIUM"; position: absolute; top: 10px; right: -30px; background: #d4af37;
  color: #fff; padding: 5px 40px; font-size: 11px; font-weight: bold; transform: rotate(45deg);
  z-index: 10; pointer-events: none;
}

.card-front img { width: 100%; height: 220px; object-fit: cover; background: #eee; flex-shrink: 0; }
.card-front.info { padding: 15px; display: flex; flex-direction: column; flex: 1; }
.card-front h3 { font-size: 16px; color: #333; margin-bottom: 8px; }
.preco { font-weight:bold; color:#2a9d8f; font-size:22px; margin-bottom:10px; margin-top: auto; }
.btn-pedir { background: #25D366; color: #fff; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; width: 90%; margin: 0 auto; display: block; }

.card-back h3 { font-size: 18px; margin-bottom: 15px; color: #f5e9da; flex-shrink: 0; }
.card-back.descricao {
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-line; /* Respeita Alt+Enter e colar texto */
  text-align: left;
  overflow-y: auto; /* SCROLL SE PASSAR */
  flex: 1; /* Ocupa todo espaço que sobrar */
  padding-right: 5px; /* Espaço pra barra de rolagem */
}
/* Scroll bonito */
.card-back.descricao::-webkit-scrollbar { width: 4px; }
.card-back.descricao::-webkit-scrollbar-thumb { background: #f5e9da; border-radius: 2px; }

.card-back.dica { font-size: 11px; margin-top: 15px; opacity: 0.7; flex-shrink: 0; }

.sobre { background: #fff; text-align: center; border-radius: 15px; padding: 30px 20px; }
.rodape { background: #222; color: #aaa; text-align: center; padding: 20px; font-size: 12px; }
.rodape a { color: #25D366; font-weight: 600; text-decoration: none; }
.loading { text-align: center; color: #6b3e26; font-size: 18px; padding: 40px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="toggleMenu()">×</button>
  <div id="menu-itens"></div>
  <a href="#" onclick="showPage('sobre')">Sobre Nós</a>
  <a href="https://wa.me/5551997215808?text=Ol%C3%A1%2C%20vim%20pelo%20site%20e%20desejo%20fazer%20um%20pedido%20personalizado%21" target="_blank">Monte seu pedido</a>
</div>

<div class="header">
  <img src="header_final_dccestas.jpg" alt="D'cestas e presentes">
  <button class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></button>
  <div class="botoes-topo">
    <a href="https://wa.me/5551997215808?text=Ol%C3%A1%2C%20vim%20pelo%20site" target="_blank" class="btn-icone btn-icone-whatsapp">Whats</a>
    <a href="https://www.instagram.com/d.cestasepresentes" target="_blank" class="btn-icone btn-icone-instagram">Insta</a>
  </div>
</div>

<div id="home" class="page active">
  <div class="produtos">
    <h2>🌟 DESTAQUES PREMIUM</h2>
    <div id="catalogo-home" class="catalogo"><div class="loading">Carregando...</div></div>
  </div>
</div>
<div id="paginas-dinamicas"></div>
<div id="sobre" class="page">
  <button class="voltar-btn" onclick="showPage('home')">← Voltar</button>
  <div class="sobre"><h2>SOBRE NÓS</h2><p>Somos a D'cestas e presentes de Cidreira e região.</p></div>
</div>
<div class="rodape">Desenvolvido por <a href="https://wa.me/5551985108885" target="_blank">Edmilson Bittencourt</a></div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/11fxpMU9iX_U01qyMOAUfmcNTbw68ZZhg17dIM69frmI/export?format=csv";
const NUMERO_WHATSAPP = "5551997215808";
let todasCategorias = [];

// Lê CSV com vírgula e quebra de linha dentro da célula
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i+1];
    if (char === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else { inQuotes =!inQuotes; }
    } else if (char === ',' &&!inQuotes) {
      row.push(cell); cell = '';
    } else if ((char === '\n' || char === '\r') &&!inQuotes) {
      if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (char === '\r' && next === '\n') i++;
    } else { cell += char; }
  }
  if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); }
  const headers = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), r[i]?.trim() || ''])));
}

function converterLinkDrive(link) {
  if(!link) return "";
  link = link.replace(/"/g, '').trim();
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  return link;
}

function formatarPreco(valor) {
  if(!valor) return "0,00";
  valor = valor.replace(/"/g, '').replace(',', '.').trim();
  const num = parseFloat(valor);
  return isNaN(num)? valor : num.toLocaleString('pt-BR', {minimumFractionDigits: 2});
}

function criarCard(produto, isPremium = false) {
  const img = converterLinkDrive(produto['Link da imagem']);
  const preco = formatarPreco(produto['Valor']);
  const descricao = produto['Descricao'] || "Toque para ver o que vem na cesta";
  const btn = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(`Olá D'cestas! Quero orçar: ${produto['Nome']}`)}`;

  return `
    <div class="card-wrapper">
      <div class="card ${isPremium? 'premium' : ''}" onclick="this.classList.toggle('flipped')">
        <div class="card-face card-front">
          <img src="${img}" alt="${produto['Nome']}" onerror="this.src='https://via.placeholder.com/260x220?text=Sem+Imagem'">
          <div class="info">
            <h3>${produto['Nome']}</h3>
            <p class="preco">R$ ${preco}</p>
            <a href="${btn}" target="_blank" class="btn-pedir" onclick="event.stopPropagation()">Pedir no WhatsApp</a>
          </div>
        </div>
        <div class="card-face card-back">
          <h3>O que vem na cesta</h3>
          <div class="descricao">${descricao}</div>
          <p class="dica">Toque novamente para voltar</p>
        </div>
      </div>
    </div>
  `;
}

function criarPaginaCategoria(categoria) {
  const id = categoria.toLowerCase().replace(/\s+/g, '-');
  return `<div id="${id}" class="page"><button class="voltar-btn" onclick="showPage('home')">← Voltar</button><h2>${categoria.toUpperCase()}</h2><div id="catalogo-${id}" class="catalogo"><div class="loading">Carregando...</div></div></div>`;
}

function gerarMenuECategorias(dados) {
  todasCategorias = [...new Set(dados.map(p => p['Categoria']).filter(c => c && c.toLowerCase()!== 'premium'))];
  document.getElementById('menu-itens').innerHTML = `<a href="#" onclick="showPage('home')">Destaques</a>` + todasCategorias.map(cat => `<a href="#" onclick="showPage('${cat.toLowerCase().replace(/\s+/g, '-')}')">${cat}</a>`).join('');
  document.getElementById('paginas-dinamicas').innerHTML = todasCategorias.map(cat => criarPaginaCategoria(cat)).join('');
}

function preencherProdutos(dados) {
  const premium = dados.filter(p => p['Categoria']?.toLowerCase() === 'premium');
  document.getElementById('catalogo-home').innerHTML = premium.map(p => criarCard(p, true)).join('') || '<p>Nenhum Premium</p>';
  todasCategorias.forEach(cat => {
    const id = cat.toLowerCase().replace(/\s+/g, '-');
    const produtosDaCat = dados.filter(p => p['Categoria']?.toLowerCase() === cat.toLowerCase());
    document.getElementById(`catalogo-${id}`).innerHTML = produtosDaCat.map(p => criarCard(p)).join('') || `<p>Nenhum produto de ${cat}</p>`;
  });
}

async function carregarProdutos() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const texto = await res.text();
    const dados = parseCSV(texto).filter(p => p['Nome']);
    gerarMenuECategorias(dados);
    preencherProdutos(dados);
  } catch(e) {
    console.error(e);
    document.querySelectorAll('.catalogo').forEach(c => c.innerHTML = '<p>Erro ao carregar. Verifica se a planilha está publicada.</p>');
  }
}

function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.getElementById('sidebar').classList.remove('active');
  window.scrollTo(0, 0);
}

carregarProdutos();
</script>
</body>
</html>
