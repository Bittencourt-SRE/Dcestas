* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; background: #fdf8f5; color: #333; }
.header { position: relative; }

.botoes-topo { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.btn-icone {
  width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;

.btn-icone:hover { transform: scale(1.1); }
.btn-icone-whatsapp { background: #25D366; }
.btn-icone-instagram { background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); }

.sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #6b3e26; transition: 0.3s; padding-top: 100px; z-index: 99; }
.sidebar.active { left: 0; }
.sidebar a { display: block; padding: 18px 30px; color: #fff; text-decoration: none; font-size: 18px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; background: none; border: none; color: #fff; cursor: pointer; }

.page { display: none; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }

.catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

.card-wrapper { perspective: 1000px; position: relative; }
.card {
  position: relative; width: 100%; height: auto;
  transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: relative;
  width: 100%;
  backface-visibility: hidden;
  border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  overflow: hidden; background: #fff; display: flex; flex-direction: column; text-align: center;

.card-back {

.card-front img { width: 100%; height: 220px; object-fit: cover; background: #eee; display: block; }
.card-front.info {

.card-back h3 { font-size: 20px; margin-bottom: 15px; color: #fff; font-weight: 700; }

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/11fxpMU9iX_U01qyMOAUfmcNTbw68ZZhg17dIM69frmI/export?format=csv";
const NUMERO_WHATSAPP = "555199995702188"; // NUMERO CORRIGIDO DA KEROLYN
let todasCategorias = [];
let carrinho = [];

function parseCSV(text) { /*...igual ao anterior... */
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i+1];
    if (char === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else { inQuotes =!inQuotes; }
    } else if (char === ',' &&!inQuotes) {
      row.push(cell); cell = '';
    } else if ((char === '\n' || char === '\r') &&!inQuotes) {
      if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (char === '\r' && next === '\n') i++;
    } else { cell += char; }
  }
  if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); }
  const headers = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), r[i]?.trim() || ''])));
}

function converterLinkDrive(link) {
  if(!link) return "";
  link = link.replace(/"/g, '').trim();
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  return link;
}

function formatarPreco(valor) {
  if(!valor) return "0,00";
  valor = valor.replace(/[^0-9.,]/g, '');
  if(valor.includes('.') && valor.includes(',')) {
    valor = valor.replace(/\./g, '').replace(',', '.');
  }
  else if(valor.includes(',')) {
    valor = valor.replace(',', '.');
  }
  const num = parseFloat(valor);
  if(isNaN(num)) return "0,00";
  return num.toLocaleString('pt-BR', {minimumFractionDigits: 2});
}

function precoParaNum(valor) {
  valor = valor.replace(/[^0-9.,]/g, '');
  if(valor.includes('.') && valor.includes(',')) {
    valor = valor.replace(/\./g, '').replace(',', '.');
  }
  else if(valor.includes(',')) {
    valor = valor.replace(',', '.');
  }
  return parseFloat(valor) || 0;
}

function criarCard(produto, isPremium = false) {
  const img = converterLinkDrive(produto['Link da imagem']);
  const preco = formatarPreco(produto['Valor']);
  const precoNum = precoParaNum(produto['Valor']);
  const descricao = produto['Descricao'] || "Toque para ver o que vem na cesta";

  return `
    <div class="card-wrapper">
      <div class="card ${isPremium? 'premium' : ''}" onclick="this.classList.toggle('flipped')">
        <div class="card-face card-front">
          <img src="${img}" alt="${produto['Nome']}" onerror="this.src='https://via.placeholder.com/260x220?text=Sem+Imagem'">
          <div class="info">
            <h3>${produto['Nome']}</h3>
            <p class="preco" data-preco="${precoNum}">R$ ${preco}</p>
            <button class="btn-pedir" onclick="event.stopPropagation(); adicionarAoCarrinho('${produto['Nome']}', ${precoNum})">Adicionar ao Carrinho</button>
          </div>
        </div>
        <div class="card-face card-back">
          <h3>O que vem na cesta</h3>
          <div class="descricao">${descricao}</div>
          <p class="dica">Toque novamente para voltar</p>
        </div>
      </div>
    </div>
  `;
}

function criarPaginaCategoria(categoria) {
  const id = categoria.toLowerCase().replace(/\s+/g, '-');
  return `<div id="${id}" class="page"><button class="voltar-btn" onclick="showPage('home')">← Voltar</button><h2>${categoria.toUpperCase()}</h2><div id="catalogo-${id}" class="catalogo"><div class="loading">Carregando...</div></div></div>`;
}

function gerarMenuECategorias(dados) {
  todasCategorias = [...new Set(dados.map(p => p['Categoria']).filter(c => c && c.toLowerCase()!== 'premium'))];
  document.getElementById('menu-itens').innerHTML = `<a href="#" onclick="showPage('home')">Destaques</a>` + todasCategorias.map(cat => `<a href="#" onclick="showPage('${cat.toLowerCase().replace(/\s+/g, '-')}')">${cat}</a>`).join('');
  document.getElementById('paginas-dinamicas').innerHTML = todasCategorias.map(cat => criarPaginaCategoria(cat)).join('');
}

function preencherProdutos(dados) {
  const premium = dados.filter(p => p['Categoria']?.toLowerCase() === 'premium');
  document.getElementById('catalogo-home').innerHTML = premium.map(p => criarCard(p, true)).join('') || '<p>Nenhum Premium</p>';
  todasCategorias.forEach(cat => {
    const id = cat.toLowerCase().replace(/\s+/g, '-');
    const produtosDaCat = dados.filter(p => p['Categoria']?.toLowerCase() === cat.toLowerCase());
    document.getElementById(`catalogo-${id}`).innerHTML = produtosDaCat.map(p => criarCard(p)).join('') || `<p>Nenhum produto de ${cat}</p>`;
  });
}

// ===== FUNÇÕES DO CARRINHO =====
function adicionarAoCarrinho(nome, preco) {
  const itemExistente = carrinho.find(item => item.nome === nome);
  if(itemExistente) {
    itemExistente.qtd++;
  } else {
    carrinho.push({ nome, preco, qtd: 1 });
  }
  atualizarBadge();
  abrirPopupAdicionado(nome);
}

function atualizarBadge() {
  const totalItens = carrinho.reduce((soma, item) => soma + item.qtd, 0);
  const badge = document.getElementById('badge-qtd');
  badge.innerText = totalItens;
  badge.style.display = totalItens > 0? 'flex' : 'none';
}

function abrirPopupAdicionado(nome) {
  document.getElementById('popup-titulo').innerText = "Produto Adicionado!";
  document.getElementById('conteudo-popup').innerHTML = `
    <p style="text-align:center; margin-bottom:20px;"><b>${nome}</b> foi adicionado ao carrinho.</p>
    <div class="btn-botoes">
      <button class="btn-azul btn-secundario" onclick="fecharPopup()">Continuar Comprando</button>
      <button class="btn-azul" onclick="abrirCarrinho()">Finalizar Pedido</button>
    </div>
  `;
  document.getElementById('popup-overlay').classList.add('active');
}

function abrirCarrinho() {
  if(carrinho.length === 0) {
    alert("Seu carrinho está vazio!");
    return;
  }
  document.getElementById('popup-titulo').innerText = "Finalizar Pedido";
  let htmlItens = '<div class="lista-carrinho">';
  let totalGeral = 0;
  carrinho.forEach((item, index) => {
    const subtotal = item.preco * item.qtd;
    totalGeral += subtotal;
    htmlItens += `
      <div class="item-carrinho">
        <span>${item.qtd}x ${item.nome}</span>
        <span>R$ ${subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
      </div>
    `;
  });
  htmlItens += `</div><div class="total-geral">Total: R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>`;

  htmlItens += `
    <form id="form-pedido">
      <div class="form-group">
        <label>Nome Completo <span class="req">*</span></label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label>Telefone <span class="req">*</span></label>
        <input type="tel" id="telefone" required>
      </div>
      <div class="form-group">
        <label>Endereço de Entrega <span class="req">*</span></label>
        <textarea id="endereco" rows="2" required></textarea>
      </div>
      <div class="form-group">
        <label>Forma de Pagamento <span class="req">*</span></label>
        <div class="pagamento-options">
          <label><input type="radio" name="pagamento" value="Pix" required> Pix</label>
          <label><input type="radio" name="pagamento" value="Cartão"> Cartão</label>
          <label><input type="radio" name="pagamento" value="Dinheiro"> Dinheiro</label>
        </div>
      </div>
      <div class="form-group">
        <label>Observação</label>
        <textarea id="obs" rows="2"></textarea>
      </div>
      <button type="submit" class="btn-azul">Enviar Pedido no WhatsApp</button>
    </form>
  `;
  document.getElementById('conteudo-popup').innerHTML = htmlItens;
  document.getElementById('popup-overlay').classList.add('active');

  document.getElementById('form-pedido').addEventListener('submit', enviarPedido);
}

function enviarPedido(e) {
  e.preventDefault();
  const nome = document.getElementById('nome').value;
  const telefone = document.getElementById('telefone').value;
  const endereco = document.getElementById('endereco').value;
  const pagamento = document.querySelector('input[name="pagamento"]:checked').value;
  const obs = document.getElementById('obs').value;
  let totalGeral = 0;

  let listaProdutos = '';
  carrinho.forEach((item, index) => {
    const subtotal = item.preco * item.qtd;
    totalGeral += subtotal;
    listaProdutos += `${index + 1}. ${item.nome} - Qtd: ${item.qtd} - R$ ${subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}\n`;
  });

  const mensagem = `🛒 *NOVO PEDIDO*

${listaProdutos}
*TOTAL GERAL: R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}*

👤 *NOME:* ${nome}
📱 *TEL:* ${telefone}
📍 *ENDEREÇO:* ${endereco}
💳 *PAGAMENTO:* ${pagamento}
📝 *OBS:* ${obs}`;

  const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
  window.open(url, '_blank');
  carrinho = [];
  atualizarBadge();
  fecharPopup();
}

function fecharPopup() {
  document.getElementById('popup-overlay').classList.remove('active');
}

// ===== DRAG DO BOTÃO CARRINHO =====
let isDragging = false, offsetX, offsetY;
const btnCarrinho = document.getElementById('btn-carrinho');
btnCarrinho.addEventListener('mousedown', e => { isDragging = true; offsetX = e.clientX - btnCarrinho.offsetLeft; offsetY = e.clientY - btnCarrinho.offsetTop; });
document.addEventListener('mousemove', e => { if(isDragging) { btnCarrinho.style.left = e.clientX - offsetX + 'px'; btnCarrinho.style.right = 'auto'; btnCarrinho.style.bottom = 'auto'; } });
document.addEventListener('mouseup', () => { isDragging = false; });

async function carregarProdutos() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const texto = await res.text();
    const dados = parseCSV(texto).filter(p => p['Nome']);
    gerarMenuECategorias(dados);
    preencherProdutos(dados);
  } catch(e) {
    console.error(e);
    document.querySelectorAll('.catalogo').forEach(c => c.innerHTML = '<p>Erro ao carregar. Verifica se a planilha está publicada.</p>');
  }
}

function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.getElementById('sidebar').classList.remove('active');
  window.scrollTo(0, 0);
}

carregarProdutos();
</script>
